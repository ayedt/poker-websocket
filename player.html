<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Player</title>
</head>
<body>
<h1>玩家端</h1>
<input id="playerId" placeholder="输入ID注册" />
<button onclick="register()">注册</button>
<h2>手牌</h2>
<div id="hand"></div>
<h2>公共牌</h2>
<div id="community"></div>
<script>
let ws = new WebSocket('wss://' + location.host);
function register(){
  const id = document.getElementById('playerId').value;
  ws.send(JSON.stringify({type:'register', id}));
}
ws.onmessage = (msg)=>{
  const data = JSON.parse(msg.data);
  if(data.type==='hand'){
    document.getElementById('hand').innerText = data.cards.map(c=>c.value+c.suit).join(', ');
  }
  if(data.type==='community'){
    document.getElementById('community').innerText = data.cards.map(c=>c.value+c.suit).join(', ');
  }
}
</script>
</body>
</html>
